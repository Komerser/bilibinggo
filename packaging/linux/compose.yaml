services:
  binggo:
    build:
      context: .
      dockerfile: app/packaging/linux/Dockerfile
    image: binggo-server:6.1.2.01
    restart: unless-stopped
    network_mode: host
    init: true
    user: "10001:10001"
    environment:
      BINGGO_HOME: /var/lib/binggo
      BINGGO_PORT: "8182"
      TZ: Asia/Shanghai
    volumes:
      - ./user-data:/var/lib/binggo
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8182/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
